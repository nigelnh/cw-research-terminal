# Alembic configuration for the CW Research Platform persistence layer.
# The database URL is NOT stored here - env.py reads it from application settings
# (settings.sync_database_url(), derived from DATABASE_URL) or from `-x db_url=...`.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# Migration filenames: 0001_slug.py, 0002_slug.py, ...
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
