name: Fundamentals refresh — Vietcap → Postgres

# Production cannot fetch fundamentals itself. Railway's egress (AS400940, Amsterdam) is
# answered with HTTP 403 on Vietcap's VCI GraphQL fundamentals query, while the identical
# library version and query succeed from a university network (AS11231) and from a
# GitHub-hosted runner (Azure, AS8075) - verified by probing from inside the production
# container and from a runner on 2026-09-21. The rejection tracks the calling ASN, and
# nothing in this repository can move Railway's egress.
#
# The consequence in production was total: /api/market/fundamentals/{symbol} answered
# pe, pb, eps, roe and roa all null for every equity, with quarters: [].
#
# So this job is the ONLY writer of `instrument_fundamentals`; the API only reads it.
# Fundamentals change once a quarter, so a daily refresh is already generous and the run
# is paced (--delay) because hammering the source is the most plausible way an egress
# earns a block in the first place.
#
# ACTIVATION GATE (needs the repo owner):
#   Add repo secret PRODUCTION_DATABASE_URL (the Railway Postgres URL).
# The schedule below is already live but every step no-ops until that secret exists, so
# there is exactly one thing left to do.

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Comma-separated equities (default: every current CW underlying)"
        required: false
        default: ""
  schedule:
    - cron: "0 20 * * *"   # 03:00 ICT — well clear of the trading session

concurrency:
  group: fundamentals-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # GitHub does not allow secrets in job/step `if` expressions. Expose only a presence
    # flag to the guards; the URL itself stays scoped to the step that needs it.
    env:
      HAS_PRODUCTION_DATABASE: ${{ secrets.PRODUCTION_DATABASE_URL != '' }}
      # The 20 underlyings behind every currently listed covered warrant.
      DEFAULT_SYMBOLS: "ACB,FPT,HDB,HPG,LPB,MBB,MSN,MWG,SHB,SSB,STB,TCB,TPB,VHM,VIB,VIC,VJC,VNM,VPB,VRE"
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Skip when database secret is absent
        if: ${{ env.HAS_PRODUCTION_DATABASE != 'true' }}
        working-directory: .
        run: echo 'PRODUCTION_DATABASE_URL is not configured; fundamentals refresh skipped.'
      - uses: actions/checkout@v4
        if: ${{ env.HAS_PRODUCTION_DATABASE == 'true' }}
      - uses: actions/setup-python@v5
        if: ${{ env.HAS_PRODUCTION_DATABASE == 'true' }}
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
        if: ${{ env.HAS_PRODUCTION_DATABASE == 'true' }}
      - name: Refresh fundamentals
        if: ${{ env.HAS_PRODUCTION_DATABASE == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          ACCEPT_TC: "tôi đồng ý"
          SYMBOLS: ${{ github.event.inputs.symbols }}
        run: |
          python -m app.persistence.cli fundamentals \
            --symbols "${SYMBOLS:-$DEFAULT_SYMBOLS}" \
            --json
